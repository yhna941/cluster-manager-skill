[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluster-manager"
version = "0.1.0"
description = "Agentless Linux infrastructure inventory"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pydantic>=2", "rich>=13", "asyncssh>=2.17", "PyYAML>=6"]

[project.scripts]
cluster-manager = "cluster_manager.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13", "types-PyYAML"]

[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
